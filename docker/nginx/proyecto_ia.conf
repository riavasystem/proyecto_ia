# Copiar a /etc/nginx/sites-available/proyecto_ia.conf en el servidor y
# habilitar con: ln -s /etc/nginx/sites-available/proyecto_ia.conf /etc/nginx/sites-enabled/
# Luego emitir el certificado: certbot --nginx -d api-ia.riava.cl

server {
    listen 80;
    server_name api-ia.riava.cl;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
